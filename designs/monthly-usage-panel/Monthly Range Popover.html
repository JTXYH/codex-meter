<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="design_doc_mode" content="mockup">
  <title>Codex Meter · 月份范围浮层</title>
  <!-- Focused revision: replace the native nested range menu with one anchored
       popover. Preserve C, regular typography, month-only labels and date tooltips.
       This page is a design prototype; no Swift application code is changed. -->
  <link rel="stylesheet" href="monthly-usage.css">
  <link rel="stylesheet" href="monthly-styles.css">
  <style>
    body{background:var(--canvas)}
    .popover-review{max-width:480px;margin:0 auto;padding:28px 20px 44px}
    .review-head{display:flex;align-items:center;justify-content:space-between;margin:0 7px 20px;font-size:12px;color:var(--secondary)}
    .theme-switch{border:1px solid var(--border);background:var(--card);border-radius:7px;padding:6px 9px;font-size:10px;color:var(--secondary)}
    .range-preview{border:1px solid var(--border);width:420px;margin:0 auto;box-shadow:0 18px 42px rgba(30,35,60,.07)}
    .range-preview *{font-weight:400!important}
    .range-preview .variant-card{position:relative}
    .range-picker{position:relative;flex-shrink:0}
    .range-trigger{display:flex;align-items:center;gap:6px;min-height:26px;padding:4px 8px;border:0;border-radius:7px;background:var(--control);font-size:10px;color:var(--secondary);cursor:pointer}
    .range-trigger[aria-expanded="true"]{color:var(--accent);background:var(--accent-soft)}
    .chevron{width:5px;height:5px;border-right:1px solid currentColor;border-bottom:1px solid currentColor;transform:rotate(45deg);margin:0 2px 3px}
    .range-popover{position:absolute;top:calc(100% + 7px);right:0;z-index:10;width:146px;padding:5px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 26px rgba(20,25,50,.13),0 2px 5px rgba(20,25,50,.04)}
    .range-option{display:flex;align-items:center;justify-content:space-between;width:100%;height:33px;padding:0 10px;border:0;border-radius:7px;background:transparent;text-align:left;font-size:12px;color:var(--primary);cursor:pointer}
    .range-option+.range-option{margin-top:2px}
    .range-option:hover{background:var(--control);filter:none}
    .range-option[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
    .range-check{width:12px;height:12px;display:grid;place-items:center;font-size:12px}
    .range-option[aria-selected="false"] .range-check{visibility:hidden}
    .range-option:focus-visible{outline:1.5px solid var(--accent);outline-offset:-2px}
    .range-preview .month-tabs{display:flex;overflow-x:auto;scrollbar-width:none;margin-top:0}
    .range-preview .month-tabs::-webkit-scrollbar{display:none}
    .range-preview .month-tab{min-width:52px;flex:1 0 52px;white-space:nowrap}
    .range-preview .mini-month-bars{grid-template-columns:repeat(var(--month-count,12),1fr)}
    .range-preview .mini-month-bar{padding:0 2px}
    .range-preview .mini-month-bar>i{min-height:2px}
    .review-explanation{margin:20px 8px 0;font-size:12px;line-height:1.8;color:var(--secondary)}
    .review-explanation p{margin:0 0 7px}
    .review-explanation small{font-size:10px;color:var(--tertiary)}
    [data-theme="dark"] .range-popover{box-shadow:0 8px 30px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.2)}
    @media(max-width:460px){.popover-review{padding:24px 12px}.range-preview{width:100%}}
  </style>
</head>
<body>
  <main class="popover-review">
    <div class="review-head"><span>月份范围 · 单层选择</span><button class="theme-switch" id="theme">深色预览</button></div>
    <div class="variant-frame range-preview" data-screen-label="月度统计 · 新范围浮层">
      <section class="variant-card month-selector-card">
        <div class="variant-heading">
          <h2><span class="calendar-icon" aria-hidden="true"></span>月度统计</h2>
          <div class="range-picker" id="range-picker">
            <button class="range-trigger" id="range-trigger" aria-haspopup="listbox" aria-expanded="true" aria-controls="range-options"><span id="range-value">近 12 个月</span><i class="chevron" aria-hidden="true"></i></button>
            <div class="range-popover" id="range-options" role="listbox" aria-label="月份范围">
              <button class="range-option" role="option" data-count="3" aria-selected="false"><span>近 3 个月</span><span class="range-check" aria-hidden="true">✓</span></button>
              <button class="range-option" role="option" data-count="6" aria-selected="false"><span>近 6 个月</span><span class="range-check" aria-hidden="true">✓</span></button>
              <button class="range-option" role="option" data-count="12" aria-selected="true"><span>近 12 个月</span><span class="range-check" aria-hidden="true">✓</span></button>
            </div>
          </div>
        </div>
        <div class="month-tabs" id="month-tabs" role="group" aria-label="选择月份"></div>
        <div class="month-detail-title"><span class="month-status-dot"></span><span id="month-title">本月用量</span></div>
        <div class="selected-metrics">
          <div class="selected-metric"><span>Token</span><strong id="token-value">10 亿 2 千万</strong></div>
          <div class="selected-metric"><span>API 等效费用</span><strong id="cost-value">$1,428.36</strong></div>
        </div>
        <div class="mini-month-bars" id="month-bars" aria-label="各月 Token 用量"></div>
        <div class="variant-footnote"><span class="tiny-info">i</span><span id="month-note">本月统计截至当前时刻</span></div>
      </section>
    </div>
    <div class="review-explanation"><p>点击右上角直接展开 3 个选项，选中即切换并收起。</p><small>保留常规字重；点空白处或按 Esc 关闭。图中为示例数据。</small></div>
  </main>
  <script>
    (() => {
      const picker = document.getElementById('range-picker');
      const trigger = document.getElementById('range-trigger');
      const popover = document.getElementById('range-options');
      const tokens = ['10 亿 2 千万','3 亿 8 千万','2 亿','1 亿','6 千万','2 千万'];
      const costs = ['$1,428.36','$1,068.20','$876.50','$640.25','$492.65','$379.00'];
      const ratios = [100,37.25,19.61,9.80,5.88,1.96];
      let count = 12, selected = 0, open = true;
      function label(index){return index === 0 ? '本月' : `${((8-index+12)%12)+1} 月`;}
      function fullDate(index){const first=new Date(2026,8-index,1),last=index===0?new Date(2026,8,21):new Date(2026,9-index,0);const format=d=>`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;return `${format(first)} – ${format(last)}`;}
      function showPopover(value){open=value;popover.hidden=!open;trigger.setAttribute('aria-expanded',String(open));}
      function render(){
        document.getElementById('range-value').textContent=`近 ${count} 个月`;
        document.querySelectorAll('[data-count]').forEach(button=>button.setAttribute('aria-selected',String(Number(button.dataset.count)===count)));
        const tabs=document.getElementById('month-tabs'),bars=document.getElementById('month-bars');tabs.replaceChildren();bars.replaceChildren();bars.style.setProperty('--month-count',count);
        for(let i=0;i<count;i++){
          const tab=document.createElement('button');tab.className='month-tab'+(i===selected?' active':'');tab.textContent=label(i);tab.title=fullDate(i);tab.setAttribute('aria-pressed',String(i===selected));tab.addEventListener('click',()=>selectMonth(i));tabs.append(tab);
          const bar=document.createElement('button');bar.className='mini-month-bar'+(i===selected?' selected':'');bar.setAttribute('aria-label',`查看${label(i)}用量`);bar.title=fullDate(i);const fill=document.createElement('i');fill.style.height=`${ratios[i]||0}%`;if(i>=6)fill.style.background='var(--tertiary)';bar.append(fill);bar.addEventListener('click',()=>selectMonth(i));bars.append(bar);
        }
        document.getElementById('month-title').textContent=`${label(selected)}用量`;
        document.getElementById('token-value').textContent=tokens[selected]||'暂无';
        document.getElementById('cost-value').textContent=costs[selected]||'暂无';
        document.getElementById('month-note').textContent=selected===0?'本月统计截至当前时刻':selected<6?'该月统计已完成':'该月没有本机用量记录';
      }
      function selectMonth(index){selected=index;showPopover(false);render();document.querySelectorAll('.month-tab')[selected]?.scrollIntoView({block:'nearest',inline:'nearest'});}
      trigger.addEventListener('click',()=>showPopover(!open));
      document.querySelectorAll('[data-count]').forEach(button=>button.addEventListener('click',()=>{count=Number(button.dataset.count);if(selected>=count)selected=0;render();showPopover(false);trigger.focus({preventScroll:true});}));
      document.addEventListener('pointerdown',event=>{if(open&&!picker.contains(event.target))showPopover(false);});
      document.addEventListener('keydown',event=>{if(event.key==='Escape'&&open){showPopover(false);trigger.focus({preventScroll:true});}if(open&&['ArrowDown','ArrowUp'].includes(event.key)){event.preventDefault();const options=[...document.querySelectorAll('[data-count]')];const current=options.indexOf(document.activeElement);const next=current<0?options.findIndex(button=>Number(button.dataset.count)===count):(current+(event.key==='ArrowDown'?1:2))%3;options[next].focus();}});
      document.getElementById('theme').addEventListener('click',()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';document.getElementById('theme').textContent=dark?'浅色预览':'深色预览';});
      render();
    })();
  </script>
</body>
</html>
